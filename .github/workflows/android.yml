name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Locate project root
        id: root
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "./SecureChat/gradlew" ]; then
            echo "dir=SecureChat" >> $GITHUB_OUTPUT
          elif [ -f "./BestieCourt/gradlew" ]; then
            echo "dir=BestieCourt" >> $GITHUB_OUTPUT
          else
            echo "gradlew not found"; find . -name gradlew | head -5; exit 1
          fi

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.root.outputs.dir }}
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: ${{ steps.root.outputs.dir }}
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find . -name "*.apk" | head -20
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BestieCourt-debug-apk
          path: ${{ steps.root.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
